<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>This one I couldn't solve — Arash Goharrostami</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- The same cube as the loading screen, fetched ahead of the script the same way. -->
    <link rel="preload" href="models/rubiksCube.glb" as="fetch" fetchpriority="high" crossorigin />
    <link rel="preload" href="draco/draco_decoder.wasm" as="fetch" fetchpriority="high" crossorigin />
    <style>
      /* The tokens index.html sets, so the two pages read as one site. */
      :root {
        color-scheme: dark;
        --bg: #0d0f13;
        --ink: #e7e9ee;
        --ink-dim: #98a1b2;
        --ink-faint: #7d8595;
        --accent: #6ea8fe;
        --ease: cubic-bezier(.22, 1, .36, 1);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body {
        display: grid; place-content: center; padding: 24px 20px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink); text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--accent); }

      /* The cube, given up on: rises in like the loading screen's (`loadingCube.js` adds
         `in` once it is drawn) and is still there to be dragged. */
      #error-cube {
        width: min(52vmin, 340px); height: min(52vmin, 340px); margin: 0 auto;
        cursor: grab; touch-action: none; opacity: 0; transform: translateY(24px);
        transition: opacity .7s ease, transform .7s var(--ease);
      }
      #error-cube.in { opacity: 1; transform: none; }
      #error-cube.dragging { cursor: grabbing; }

      /* The copy waits for the stall (`error.js` adds `in`), then each line rises and
         fades in a step after the one above. */
      #copy > * { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .8s var(--ease); }
      #copy.in > * { opacity: 1; transform: none; }
      #copy.in > :nth-child(2) { transition-delay: .1s; }
      #copy.in > :nth-child(3) { transition-delay: .2s; }

      #eyebrow {
        margin: 8px 0 10px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase;
        color: var(--ink-dim);
      }
      h1 { margin: 0 0 12px; font-size: clamp(22px, 4.4vw, 30px); font-weight: 600; letter-spacing: -.01em; }
      #line { margin: 0 auto 26px; max-width: 42ch; color: var(--ink-dim); font-size: 14px; line-height: 1.6; }

      /* The pill the loading screen ends on — the same clear glass, and it arrives the
         same way: a point that swells into a disc and is drawn out into the pill
         (`dropIn` in `src/droplet.js`), which is why it starts unseen and nowrap. */
      #back-slot { height: 46px; display: grid; place-content: center; }
      #back {
        display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
        padding: 14px 30px; border-radius: 999px;
        font-size: 13px; letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
        color: var(--ink); opacity: 0;
        transition: transform .25s ease, border-color .25s ease;
      }
      #back.glass:hover { transform: translateY(-1px); border-color: rgba(110, 168, 254, .6); }
      #back:active { transform: scale(.97); }
      .glass {
        position: relative; overflow: hidden;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, .18), rgba(255, 255, 255, .05) 45%, rgba(255, 255, 255, .12)),
          rgba(13, 15, 19, .55);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        backdrop-filter: blur(22px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, .4);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .6),
          inset 0 -1px 0 rgba(255, 255, 255, .18),
          inset 0 0 22px rgba(255, 255, 255, .12),
          0 0 18px rgba(255, 255, 255, .1),
          0 14px 36px rgba(0, 0, 0, .45);
      }
      .glass::before {
        content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
        background:
          radial-gradient(90px 40px at 12% 0%, rgba(255, 255, 255, .45), transparent 70%),
          radial-gradient(70px 30px at 90% 100%, rgba(255, 255, 255, .3), transparent 70%);
      }
      .glass > * { position: relative; }

      #code {
        margin: 28px 0 0; min-height: 1.2em; color: var(--ink-faint);
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em;
      }
    </style>
    <!-- With no script there is no cube and no arrival: everything is simply there. -->
    <noscript><style>#copy > *, #back { opacity: 1 !important; transform: none !important; }</style></noscript>
  </head>
  <body>
    <canvas id="error-cube"></canvas>
    <div id="copy">
      <p id="eyebrow">Something went wrong</p>
      <h1>This one I couldn't solve.</h1>
      <p id="line">The page you were after isn't here — or the room tripped over itself on the way.</p>
    </div>
    <div id="back-slot"><a id="back" href="./"><span>Back to the room &rarr;</span></a></div>
    <!-- Filled from `?code=` by `error.js`, if the host passes one. -->
    <p id="code"></p>
    <script type="module" src="/src/error.js"></script>
  </body>
</html>
