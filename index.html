<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workplace — 3D Viewer</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f13; }
      body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e7e9ee; }
      canvas { display: block; }

      #overlay {
        position: fixed; inset: 0; display: grid; place-content: center; gap: 12px;
        background: #0d0f13; text-align: center; transition: opacity .4s ease;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      #overlay.error #bar-track { display: none; }
      #overlay-text { letter-spacing: .02em; }
      #overlay.error #overlay-text { color: #ff8080; max-width: 42ch; }
      #bar-track { width: 220px; height: 3px; background: #2a2e37; border-radius: 2px; overflow: hidden; }
      #bar { height: 100%; width: 0; background: #6ea8fe; transition: width .2s ease; }

      #panel {
        position: fixed; top: 14px; right: 14px; padding: 12px 14px; display: grid; gap: 9px;
        background: rgba(24, 27, 33, .82); border: 1px solid #2f3542; border-radius: 10px;
        backdrop-filter: blur(8px);
      }
      #panel label { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
      #panel input { accent-color: #6ea8fe; cursor: pointer; margin: 0; }
      #panel h2 { margin: 0 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8b93a3; }
      #hint { position: fixed; left: 14px; bottom: 12px; color: #7d8595; }
      #stats-slot > div { position: static !important; }
    </style>
  </head>
  <body>
    <div id="panel">
      <h2>Debug</h2>
      <label><input type="checkbox" id="opt-wireframe" /> Wireframe</label>
      <label><input type="checkbox" id="opt-grid" /> Grid</label>
      <label><input type="checkbox" id="opt-rotate" /> Auto-rotate</label>
      <label><input type="checkbox" id="opt-stats" /> FPS</label>
      <div id="stats-slot"></div>
    </div>

    <div id="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>

    <div id="overlay">
      <div id="overlay-text">Loading model…</div>
      <div id="bar-track"><div id="bar"></div></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
